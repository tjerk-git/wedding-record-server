<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>CMD LWD — Dancefloor</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      color: #888;
      background: #000 url('/images/dancefloor-bg.png') center / cover no-repeat;
    }
    canvas { display: block; position: fixed; inset: 0; z-index: 3; }

    /* Animated sweeping spotlight cones over the venue image */
    .beam {
      position: fixed;
      top: 0;
      left: 50%;
      width: 90vw;
      height: 100vh;
      margin-left: -45vw;
      pointer-events: none;
      transform-origin: 50% 0;
      mix-blend-mode: screen;
      clip-path: polygon(48% 0, 52% 0, 100% 100%, 0 100%);
      z-index: 1;
      filter: blur(2px);
    }
    .beam-pink   { background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(255, 45, 149, 0.85), rgba(255, 45, 149, 0) 70%); animation: sweep-a 7.5s ease-in-out infinite; }
    .beam-cyan   { background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(0, 200, 255, 0.85), rgba(0, 200, 255, 0) 70%); animation: sweep-b 9.5s ease-in-out infinite -2s; }
    .beam-yellow { background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(255, 200, 0, 0.7),  rgba(255, 200, 0, 0) 70%); animation: sweep-c 11s ease-in-out infinite -4s; }
    .beam-purple { background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(160, 70, 255, 0.8), rgba(160, 70, 255, 0) 70%); animation: sweep-d 8.5s ease-in-out infinite -1s; }

    @keyframes sweep-a {
      0%, 100% { transform: rotate(-22deg); opacity: 0.55; }
      50%      { transform: rotate( 22deg); opacity: 0.9;  }
    }
    @keyframes sweep-b {
      0%, 100% { transform: rotate( 28deg); opacity: 0.5;  }
      50%      { transform: rotate(-26deg); opacity: 0.85; }
    }
    @keyframes sweep-c {
      0%, 100% { transform: rotate(-12deg); opacity: 0.4; }
      50%      { transform: rotate( 14deg); opacity: 0.75; }
    }
    @keyframes sweep-d {
      0%, 100% { transform: rotate( 10deg); opacity: 0.5; }
      50%      { transform: rotate(-18deg); opacity: 0.85; }
    }

    /* Warming-up announcement — only visible while cutout jobs are running */
    #warming {
      position: fixed; inset: 0; z-index: 2;
      display: none; align-items: center; justify-content: center;
      pointer-events: none;
      font-weight: 900;
      font-size: clamp(3rem, 9vw, 9rem);
      letter-spacing: -0.02em;
      line-height: 0.95;
      text-align: center;
      padding: 0 4vw;
      background-clip: text; -webkit-background-clip: text;
      color: transparent;
      background-image: linear-gradient(45deg,
        #ff2d95, #ff8a00, #f5d000, #00d97e, #00b3ff, #8126ff, #ff2d95);
      background-size: 300% 300%;
      animation: hue 6s linear infinite, blink 0.9s steps(2, end) infinite;
      filter: drop-shadow(0 0 24px rgba(176, 116, 255, 0.6));
    }
    #warming.visible { display: flex; }
    @keyframes hue {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    @keyframes blink {
      0%, 49%   { opacity: 0.85; }
      50%, 100% { opacity: 0.18; }
    }

    /* Bouncing DVD logo */
    #dvd-logo {
      position: fixed; top: 0; left: 0; z-index: 4;
      width: 14vh; height: auto;
      pointer-events: none;
      will-change: transform, filter;
      filter: invert(1) hue-rotate(0deg) saturate(3) drop-shadow(0 0 12px rgba(255,255,255,0.25));
      transition: filter 0.15s ease-out;
    }

    #count {
      position: fixed; bottom: 14px; right: 18px; z-index: 5;
      font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: #333; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="beam beam-pink"></div>
  <div class="beam beam-cyan"></div>
  <div class="beam beam-yellow"></div>
  <div class="beam beam-purple"></div>
  <div id="warming"></div>
  <canvas id="stage"></canvas>
  <img id="dvd-logo" src="/images/dvd-logo.png" alt="">
  <div id="count"></div>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const countEl = document.getElementById('count');
    const warmingEl = document.getElementById('warming');
    let processingCount = 0;

    function updateProcessing(n) {
      processingCount = Math.max(0, n | 0);
      if (processingCount > 0) {
        const word = processingCount === 1 ? 'DANCER' : 'DANCERS';
        warmingEl.textContent = `${processingCount} ${word} WARMING UP…`;
        warmingEl.classList.add('visible');
      } else {
        warmingEl.classList.remove('visible');
      }
    }

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    const dancers = [];
    const seen = new Set();

    function loadImg(src) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
      });
    }

    async function addDancer(d) {
      if (seen.has(d.id)) {
        // Upgrade: if this is the full cutout arriving for an already-showing placeholder, swap frames.
        if (d.cutout) {
          const existing = dancers.find(x => x.id === d.id);
          if (existing) {
            const urls = Array.from({ length: d.frames }, (_, i) => `${d.base}/cutout-${i}.png`);
            try {
              const frames = await Promise.all(urls.map(loadImg));
              existing.frames = frames;
              const ratio = frames[0].width / frames[0].height;
              existing.w = existing.h * ratio;
            } catch (e) {
              console.warn('failed to upgrade dancer', d.id, e);
            }
          }
        }
        return;
      }
      seen.add(d.id);
      const urls = d.cutout
        ? Array.from({ length: d.frames }, (_, i) => `${d.base}/cutout-${i}.png`)
        : Array.from({ length: d.frames }, (_, i) => `${d.base}/placeholder-${i}.png`);
      let frames;
      try {
        frames = await Promise.all(urls.map(loadImg));
      } catch (e) {
        console.warn('failed to load dancer', d.id, e);
        seen.delete(d.id);
        return;
      }
      const h = innerHeight * (0.22 + Math.random() * 0.18); // 22–40% of viewport height
      const ratio = frames[0].width / frames[0].height;
      const w = h * ratio;
      const speed = 70 + Math.random() * 90;
      const angle = Math.random() * Math.PI * 2;
      dancers.push({
        id: d.id,
        frames, w, h,
        x: Math.random() * (innerWidth - w),
        y: Math.random() * (innerHeight - h),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        frameIdx: Math.floor(Math.random() * frames.length),
        frameDelay: 0.09 + Math.random() * 0.04,
        frameTick: 0,
      });
      countEl.textContent = `${dancers.length} dancer${dancers.length === 1 ? '' : 's'}`;
    }

    async function refresh() {
      try {
        const r = await fetch('/api/dancefloor', { cache: 'no-store' });
        if (!r.ok) return;
        const data = await r.json();
        const list = data.dancers || [];
        for (const d of list) await addDancer(d);
        updateProcessing(data.processing || 0);
      } catch (e) {
        console.warn('refresh failed', e);
      }
    }

    // Bouncing DVD logo state
    const dvd = document.getElementById('dvd-logo');
    const dvdState = {
      x: innerWidth * 0.3,
      y: innerHeight * 0.3,
      vx: 140,
      vy: 110,
      hue: 0,
    };
    function shiftHue() { dvdState.hue = (dvdState.hue + 47) % 360; }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      // DVD logo bounce
      const dvdW = dvd.offsetWidth || 1;
      const dvdH = dvd.offsetHeight || 1;
      dvdState.x += dvdState.vx * dt;
      dvdState.y += dvdState.vy * dt;
      if (dvdState.x < 0)                    { dvdState.x = 0; dvdState.vx *= -1; shiftHue(); }
      if (dvdState.x + dvdW > innerWidth)    { dvdState.x = innerWidth - dvdW; dvdState.vx *= -1; shiftHue(); }
      if (dvdState.y < 0)                    { dvdState.y = 0; dvdState.vy *= -1; shiftHue(); }
      if (dvdState.y + dvdH > innerHeight)   { dvdState.y = innerHeight - dvdH; dvdState.vy *= -1; shiftHue(); }
      dvd.style.transform = `translate(${dvdState.x}px, ${dvdState.y}px)`;
      dvd.style.filter = `invert(1) hue-rotate(${dvdState.hue}deg) saturate(3) drop-shadow(0 0 12px rgba(255,255,255,0.25))`;

      for (const d of dancers) {
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        if (d.x < 0)                   { d.x = 0; d.vx *= -1; }
        if (d.x + d.w > innerWidth)    { d.x = innerWidth - d.w; d.vx *= -1; }
        if (d.y < 0)                   { d.y = 0; d.vy *= -1; }
        if (d.y + d.h > innerHeight)   { d.y = innerHeight - d.h; d.vy *= -1; }
        d.frameTick += dt;
        if (d.frameTick >= d.frameDelay) {
          d.frameTick = 0;
          d.frameIdx = (d.frameIdx + 1) % d.frames.length;
        }
        ctx.drawImage(d.frames[d.frameIdx], d.x, d.y, d.w, d.h);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    refresh(); // initial hydration

    // Live updates via SSE — EventSource auto-reconnects on disconnect.
    const es = new EventSource('/api/dancefloor/stream');
    es.addEventListener('dancer', e => {
      try {
        const d = JSON.parse(e.data);
        addDancer(d);
      } catch (err) {
        console.warn('bad dancer event', err);
      }
    });
    es.addEventListener('processing', e => {
      try {
        const { count } = JSON.parse(e.data);
        updateProcessing(count);
      } catch (err) {
        console.warn('bad processing event', err);
      }
    });
    es.addEventListener('remove', e => {
      try {
        const { id } = JSON.parse(e.data);
        const i = dancers.findIndex(d => d.id === id);
        if (i !== -1) dancers.splice(i, 1);
        seen.delete(id);
        countEl.textContent = dancers.length
          ? `${dancers.length} dancer${dancers.length === 1 ? '' : 's'}`
          : '';
      } catch (err) {
        console.warn('bad remove event', err);
      }
    });
    es.addEventListener('error', () => { /* EventSource auto-reconnects */ });
  </script>
</body>
</html>
